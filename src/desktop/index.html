<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Agent Room</title>
<style>
  :root {
    --bg: #16161e;
    --bg2: #1c1c26;
    --bg3: #23232f;
    --border: #2c2c3a;
    --fg: #c8c8d8;
    --dim: #7c7c92;
    --accent: #6c8cff;
    --green: #89d185;
    --red: #e06c75;
    --c0: #4fc1ff; --c1: #e5c07b; --c2: #c678dd; --c3: #56b6c2; --c4: #98c379; --c5: #e06c75;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: grid;
    grid-template-columns: 250px minmax(380px, 1fr) minmax(320px, 1.05fr);
    overflow: hidden;
  }
  h3 { margin: 0; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); }
  button { font-family: inherit; }

  /* ── left sidebar: projects + agents ── */
  #side { background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  #side .sec { padding: 0.8rem 0.9rem 0.4rem; display: flex; justify-content: space-between; align-items: center; }
  .miniBtn {
    background: var(--bg3); color: var(--fg); border: 1px solid var(--border);
    border-radius: 5px; padding: 0.1rem 0.5rem; cursor: pointer; font-size: 0.85rem;
  }
  .miniBtn:hover { border-color: var(--accent); }
  #projects { max-height: 30%; overflow-y: auto; padding: 0.2rem 0.5rem 0.5rem; flex-shrink: 0; }
  .project { padding: 0.42rem 0.6rem; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; margin-bottom: 2px; }
  .project:hover { background: var(--bg3); }
  .project.selected { background: var(--bg3); outline: 1px solid var(--border); }
  .project .pName { flex: 1; font-size: 0.84rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .project .badge { font-size: 0.64rem; color: var(--green); border: 1px solid var(--green); border-radius: 8px; padding: 0 0.35rem; display: none; }
  .project.running .badge { display: inline; animation: fade 1.2s ease-in-out infinite alternate; }
  @keyframes fade { from { opacity: 1; } to { opacity: 0.45; } }
  .sideEmpty { color: var(--dim); font-size: 0.78rem; padding: 0.5rem 0.9rem; font-style: italic; }

  #agentsWrap { flex: 1; overflow-y: auto; border-top: 1px solid var(--border); min-height: 0; }
  .stateGroup { padding: 0.55rem 0.9rem 0.1rem; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim); }
  .row {
    display: flex; align-items: center; gap: 0.55rem; padding: 0.45rem 0.9rem;
    cursor: pointer; border-left: 2px solid transparent;
  }
  .row:hover { background: var(--bg3); }
  .row.selected { background: var(--bg3); border-left-color: var(--accent); }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.72rem; color: var(--bg); flex-shrink: 0; position: relative;
  }
  .avatar .dot {
    position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%;
    background: var(--dim); border: 2px solid var(--bg2);
  }
  .row[data-state="working"] .avatar .dot { background: var(--green); animation: pulse 1.1s ease-in-out infinite; }
  .row[data-state="done"] .avatar .dot { background: var(--green); }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.5); opacity: 0.6; } }
  .row .info { flex: 1; min-width: 0; }
  .row .rName { font-size: 0.83rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .rSub { font-size: 0.68rem; color: var(--dim); }
  .row .del { visibility: hidden; background: none; border: none; color: var(--dim); cursor: pointer; font-size: 0.8rem; }
  .row:hover .del { visibility: visible; }
  .row .del:hover { color: var(--red); }

  /* ── main pane ── */
  #main { display: flex; flex-direction: column; border-right: 1px solid var(--border); min-width: 0; }
  #mainHeader { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.7rem; }
  #mainAvatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.75rem; color: var(--bg); }
  #mainTitle { font-size: 0.95rem; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #mainSub { font-size: 0.72rem; color: var(--dim); }
  #backendSel { background: var(--bg3); color: var(--fg); border: 1px solid var(--border); border-radius: 5px; padding: 0.2rem 0.4rem; font-size: 0.78rem; }
  #chat { flex: 1; overflow-y: auto; padding: 0.6rem 1rem; }
  .msg { display: flex; gap: 0.55rem; margin: 0.7rem 0; }
  .mAvatar { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.62rem; color: var(--bg); flex-shrink: 0; margin-top: 2px; }
  .msg .content { flex: 1; min-width: 0; }
  .who { font-weight: 600; font-size: 0.76rem; margin-bottom: 0.15rem; }
  .who .time { font-weight: 400; color: var(--dim); margin-left: 0.4em; font-size: 0.9em; }
  .bubble {
    white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg2);
    border: 1px solid var(--border); border-left: 2px solid var(--dim);
    border-radius: 0 6px 6px 6px; padding: 0.5rem 0.65rem; font-size: 0.83rem; line-height: 1.45;
  }
  .msg.system .bubble { background: transparent; border: none; padding: 0.1rem 0; font-style: italic; color: var(--dim); }
  .msg.user .bubble { border-left-color: var(--accent); }
  #chatEmpty { color: var(--dim); font-style: italic; padding: 1rem 0; font-size: 0.85rem; }
  #statusLine { color: var(--dim); font-style: italic; font-size: 0.78rem; padding: 0.25rem 1rem; min-height: 1.2em; }
  #statusLine .dots::after { content: ''; animation: dots 1.2s steps(4, end) infinite; }
  @keyframes dots { 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  #inputRow { display: flex; gap: 0.5rem; padding: 0.6rem 1rem 0.8rem; border-top: 1px solid var(--border); }
  #task { flex: 1; resize: none; font-family: inherit; font-size: 0.85rem; color: var(--fg); background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem 0.6rem; }
  #task:focus { outline: 1px solid var(--accent); }
  #send { color: #fff; background: var(--accent); border: none; border-radius: 6px; padding: 0 1.1rem; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
  #send:disabled { opacity: 0.45; cursor: default; }

  /* ── activity pane ── */
  #activityPane { display: flex; flex-direction: column; min-width: 0; }
  #activityPane header { padding: 0.8rem 1rem 0.6rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.6rem; }
  #activityPane header h3 { flex: 1; }
  #activity { flex: 1; overflow-y: auto; padding: 0.5rem 0.8rem; font-family: Consolas, "Courier New", monospace; font-size: 0.74rem; line-height: 1.5; }
  .act { display: flex; gap: 0.5rem; margin: 1px 0; }
  .act .tag { flex-shrink: 0; min-width: 34px; font-weight: 700; }
  .act .kind { flex-shrink: 0; color: var(--dim); width: 70px; overflow: hidden; text-overflow: ellipsis; }
  .act .text { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg); min-width: 0; }
  .act.tool .text { color: var(--green); }
  .act.err .text { color: var(--red); }
  #activityEmpty { color: var(--dim); font-style: italic; padding: 0.8rem 0.2rem; font-family: "Segoe UI", system-ui, sans-serif; font-size: 0.85rem; }

  /* ── add-agent modal ── */
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none; align-items: center; justify-content: center; }
  #modal.open { display: flex; }
  #modalBox { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; width: 320px; max-height: 70vh; overflow-y: auto; padding: 0.9rem; }
  #modalBox h3 { margin-bottom: 0.6rem; }
  .roleOpt { display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0.55rem; border-radius: 6px; cursor: pointer; }
  .roleOpt:hover { background: var(--bg3); }
  .roleOpt.taken { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
  <aside id="side">
    <div class="sec"><h3>Projects</h3><button class="miniBtn" id="addProject" title="Add project">+</button></div>
    <div id="projects"></div>
    <div id="agentsWrap">
      <div class="sec"><h3>Agents</h3><button class="miniBtn" id="addAgent" title="Add agent">+</button></div>
      <div id="agents"></div>
    </div>
  </aside>

  <main id="main">
    <div id="mainHeader">
      <div id="mainAvatar">#</div>
      <div style="flex:1; min-width:0">
        <div id="mainTitle">Room</div>
        <div id="mainSub">shared chatroom — all agents</div>
      </div>
      <select id="backendSel" title="Backend">
        <option value="cursor">Cursor</option>
        <option value="claude">Claude Code</option>
      </select>
    </div>
    <div id="chat"><div id="chatEmpty">Pick a project. "Room" runs the Dev→QA loop on a task; select an agent to message it directly.</div></div>
    <div id="statusLine"></div>
    <div id="inputRow">
      <textarea id="task" rows="2" placeholder="Describe a task…"></textarea>
      <button id="send">Run</button>
    </div>
  </main>

  <aside id="activityPane">
    <header><h3 id="activityTitle">Live activity</h3></header>
    <div id="activity"><div id="activityEmpty">Agent tool calls and work stream here while agents are active.</div></div>
  </aside>

  <div id="modal"><div id="modalBox"><h3>Add agent</h3><div id="roleList"></div></div></div>

  <script src="./renderer.js"></script>
</body>
</html>

<svg width="1800" height="960" viewBox="0 0 1800 960" xmlns="http://www.w3.org/2000/svg">
<rect width="1800" height="960" fill="#1B1814"></rect>

<!-- floor grid seams -->
<rect x="0" y="470" width="1800" height="6" fill="#2B2620"></rect>
<rect x="600" y="0" width="6" height="960" fill="#2B2620"></rect>
<rect x="1200" y="0" width="6" height="960" fill="#2B2620"></rect>

<!-- ── Desks (col1,row1) — idle/home area ── -->
<g transform="translate(70,80)">
  <rect x="0" y="0" width="150" height="90" rx="6" fill="#161310"></rect>
  <rect x="10" y="8" width="130" height="60" rx="3" fill="#D67F48" fill-opacity=".3"></rect>
  <rect x="200" y="0" width="150" height="90" rx="6" fill="#161310"></rect>
  <rect x="210" y="8" width="130" height="60" rx="3" fill="#AEBF92" fill-opacity=".3"></rect>
  <rect x="0" y="160" width="150" height="90" rx="6" fill="#161310"></rect>
  <rect x="10" y="168" width="130" height="60" rx="3" fill="#D67F48" fill-opacity=".3"></rect>
  <rect x="200" y="160" width="150" height="90" rx="6" fill="#161310"></rect>
  <rect x="210" y="168" width="130" height="60" rx="3" fill="#F0E7D6" fill-opacity=".25"></rect>
</g>

<!-- ── Chat Room (col2,row1) ── -->
<g transform="translate(700,80)">
  <rect x="0" y="0" width="380" height="250" rx="8" fill="#F0E7D6" fill-opacity=".9"></rect>
  <rect x="0" y="0" width="380" height="250" rx="8" fill="none" stroke="#3A332B" stroke-width="8"></rect>
  <g stroke="#1B1814" stroke-width="5" stroke-linecap="round" fill="none" opacity=".75">
    <path d="M30 180 L100 120 L170 160 L240 80 L310 130"></path>
    <circle cx="100" cy="120" r="7" fill="#D67F48" stroke="none"></circle>
    <circle cx="240" cy="80" r="7" fill="#AEBF92" stroke="none"></circle>
  </g>
</g>

<!-- ── Meeting Room (col3,row1) — round table + chairs ── -->
<g transform="translate(1300,80)">
  <ellipse cx="190" cy="140" rx="150" ry="90" fill="#161310"></ellipse>
  <ellipse cx="190" cy="140" rx="150" ry="90" fill="none" stroke="#3A332B" stroke-width="6"></ellipse>
  <rect x="30" y="20" width="40" height="26" rx="8" fill="#2B2620"></rect>
  <rect x="320" y="20" width="40" height="26" rx="8" fill="#2B2620"></rect>
  <rect x="30" y="220" width="40" height="26" rx="8" fill="#2B2620"></rect>
  <rect x="320" y="220" width="40" height="26" rx="8" fill="#2B2620"></rect>
  <rect x="170" y="0" width="40" height="26" rx="8" fill="#2B2620"></rect>
  <rect x="170" y="248" width="40" height="26" rx="8" fill="#2B2620"></rect>
</g>

<!-- ── decorative floor (col1,row2) — plant + rug ── -->
<g transform="translate(140,600)">
  <rect x="0" y="140" width="220" height="120" rx="60" fill="#2B2620"></rect>
  <rect x="60" y="0" width="70" height="70" rx="8" fill="#2B2620"></rect>
  <path d="M95 0 C60 -40 60 -100 95 -140 C130 -100 130 -40 95 0 Z" fill="#AEBF92" fill-opacity=".85"></path>
  <path d="M95 0 C75 -30 75 -80 95 -110 C115 -80 115 -30 95 0 Z" fill="#AEBF92" fill-opacity=".55"></path>
</g>

<!-- ── Debate Room (col2,row2) — long table, two facing sides + podium ── -->
<g transform="translate(700,600)">
  <rect x="40" y="80" width="300" height="90" rx="8" fill="#161310"></rect>
  <rect x="40" y="80" width="300" height="90" rx="8" fill="none" stroke="#3A332B" stroke-width="6"></rect>
  <rect x="60" y="40" width="50" height="30" rx="6" fill="#D67F48" fill-opacity=".5"></rect>
  <rect x="270" y="40" width="50" height="30" rx="6" fill="#AEBF92" fill-opacity=".5"></rect>
  <rect x="160" y="190" width="60" height="60" rx="6" fill="#2B2620"></rect>
  <rect x="170" y="200" width="40" height="24" rx="3" fill="#F0E7D6" fill-opacity=".3"></rect>
</g>

<!-- ── Task Board (col3,row2) — corkboard, no agents ever anchor here ── -->
<g transform="translate(1300,600)">
  <rect x="20" y="0" width="340" height="240" rx="6" fill="#241F1A"></rect>
  <g transform="rotate(-4 90 60)"><rect x="60" y="30" width="60" height="60" fill="#D67F48" fill-opacity=".6"></rect></g>
  <g transform="rotate(3 190 70)"><rect x="160" y="40" width="60" height="60" fill="#AEBF92" fill-opacity=".6"></rect></g>
  <g transform="rotate(-2 290 55)"><rect x="260" y="25" width="60" height="60" fill="#F0E7D6" fill-opacity=".5"></rect></g>
  <g transform="rotate(2 100 160)"><rect x="70" y="130" width="60" height="60" fill="#F0E7D6" fill-opacity=".35"></rect></g>
  <g transform="rotate(-3 220 170)"><rect x="190" y="140" width="60" height="60" fill="#D67F48" fill-opacity=".4"></rect></g>
</g>
</svg>
